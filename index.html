<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sprint des tables</title>
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div id="menuScreen">
  <h1>Sprint des tables</h1>
  <p class="subtitle">Choisis une section pour commencer.</p>
  <div id="sectionButtons">
    <button class="sectionBtn" type="button" data-operation="addition">
      <span class="sectionBtn-label">Addition</span>
      <span class="sectionBtn-percent">0%</span>
    </button>
    <button class="sectionBtn" type="button" data-operation="subtraction">
      <span class="sectionBtn-label">Soustraction</span>
      <span class="sectionBtn-percent">0%</span>
    </button>
    <button class="sectionBtn" type="button" data-operation="multiplication">
      <span class="sectionBtn-label">Multiplication</span>
      <span class="sectionBtn-percent">0%</span>
    </button>
    <button class="sectionBtn" type="button" data-operation="division">
      <span class="sectionBtn-label">Division</span>
      <span class="sectionBtn-percent">0%</span>
    </button>
  </div>
  <a id="menuParentLink" href="parent.html">Vue parent →</a>
</div>

<div id="app" class="hidden">
  <div id="hud">
    <button id="menuBtn" type="button" aria-label="Retour au menu">←</button>
    <span id="streak">🔥 0</span>
    <span id="points">0 pt</span>
    <span id="score">0 / 0</span>
    <button id="muteBtn" type="button" aria-label="Couper la musique">♪</button>
  </div>

  <div id="streakBanner" class="hidden"></div>
  <div id="avatarBanner" class="hidden"></div>

  <div id="masteryBar" aria-label="Maîtrise globale des tables">
    <div id="masteryFill"></div>
  </div>

  <div id="stage">
    <div id="comboBadge" class="hidden"></div>
    <div id="prompt"></div>
    <div id="hint" class="hidden"></div>
    <div id="timerBar"><div id="timerFill"></div></div>
    <div id="studyCaption" class="hidden">Touche l'écran quand tu es prêt·e</div>
    <div id="runnerTrack">
      <div id="runner" class="idle tier-0">
        <span class="crest"></span>
        <span class="ring"></span>
      </div>
    </div>
    <div id="choices">
      <button id="choiceLeft" class="choice choice-left" type="button"></button>
      <button id="choiceRight" class="choice choice-right" type="button"></button>
    </div>
  </div>

  <div id="endScreen" class="hidden">
    <h1>Session terminée !</h1>
    <p id="endStats"></p>
    <div id="endProgress"></div>
    <div id="endButtons">
      <button id="restartBtn" type="button">Rejouer cette section</button>
      <button id="menuFromEndBtn" type="button">Choisir une autre section</button>
    </div>
    <a id="parentLink" href="parent.html">Vue parent →</a>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
