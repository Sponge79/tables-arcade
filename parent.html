<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprint des tables — Vue parent</title>
<link rel="stylesheet" href="src/style.css">
<style>
  html, body { overflow: auto; height: auto; min-height: 100%; }
  #parentView {
    max-width: 560px;
    margin: 0 auto;
    padding: 2rem 1.5rem 3rem;
  }
  #parentView h1 {
    font-size: 1.6rem;
    margin: 0 0 0.25rem;
  }
  #parentView .subtitle {
    color: #999;
    font-size: 0.95rem;
    margin: 0 0 1.75rem;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.75rem;
    margin-bottom: 2rem;
  }
  .card {
    background: #1c1c1c;
    border: 2px solid #2a2a2a;
    border-radius: 14px;
    padding: 0.9rem 0.5rem;
    text-align: center;
  }
  .card .value {
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--white);
  }
  .card .label {
    font-size: 0.75rem;
    color: #999;
    margin-top: 0.25rem;
  }
  .operation-block {
    margin-bottom: 2rem;
  }
  .operation-block h2 {
    font-size: 1.05rem;
    margin: 0 0 0.15rem;
  }
  .operation-block .operation-percent {
    color: var(--red);
    font-weight: 700;
    font-size: 0.9rem;
    margin: 0 0 1rem;
  }
  .group-list {
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
  }
  #backLink {
    display: inline-block;
    color: var(--white);
    text-decoration: none;
    font-weight: 700;
    border: 2px solid var(--white);
    border-radius: 999px;
    padding: 0.6rem 1.25rem;
  }
  .empty-note {
    color: #999;
    font-size: 0.95rem;
  }
</style>
</head>
<body>
<div id="parentView">
  <h1>Vue parent</h1>
  <p class="subtitle">Un coup d'œil simple — pas un tableau de bord. Tout vient des vrais paliers de mémorisation, rien n'est gonflé artificiellement.</p>

  <div class="cards">
    <div class="card"><div class="value" id="streakValue">—</div><div class="label">jours d'affilée</div></div>
    <div class="card"><div class="value" id="masteryValue">—</div><div class="label">maîtrise globale</div></div>
    <div class="card"><div class="value" id="masteredValue">—</div><div class="label">faits maîtrisés</div></div>
  </div>

  <p class="empty-note" id="lastPlayedNote"></p>

  <div id="operationBlocks"></div>

  <a id="backLink" href="index.html">← Retour au jeu</a>
</div>

<script type="module">
import { getStreakState } from './src/game/streak.js';
import { computeAllOperationsProgress } from './src/game/summary.js';

function formatDate(dateStr) {
  if (!dateStr) return 'jamais encore joué';
  const d = new Date(`${dateStr}T00:00:00`);
  return d.toLocaleDateString('fr-CA', { weekday: 'long', day: 'numeric', month: 'long' });
}

const { overallPercent, perOperation } = computeAllOperationsProgress();
const streak = getStreakState();

let totalMastered = 0;
let totalFacts = 0;
for (const op of perOperation) {
  for (const g of op.byGroup) {
    totalMastered += g.masteredCount;
    totalFacts += g.total;
  }
}

document.getElementById('streakValue').textContent = `🔥 ${streak.streakCount}`;
document.getElementById('masteryValue').textContent = `${overallPercent}%`;
document.getElementById('masteredValue').textContent = `${totalMastered}/${totalFacts}`;
document.getElementById('lastPlayedNote').textContent = `Dernière session : ${formatDate(streak.lastPlayedDate)}.`;

const blocksEl = document.getElementById('operationBlocks');
for (const op of perOperation) {
  const block = document.createElement('div');
  block.className = 'operation-block';

  const heading = document.createElement('h2');
  heading.textContent = op.label;
  const percentLine = document.createElement('p');
  percentLine.className = 'operation-percent';
  percentLine.textContent = `${op.percent}% maîtrisé`;

  const list = document.createElement('div');
  list.className = 'group-list';
  if (op.byGroup.length === 0) {
    list.innerHTML = '<p class="empty-note">Pas encore commencé.</p>';
  } else {
    for (const group of op.byGroup) {
      const row = document.createElement('div');
      row.className = 'progress-row';
      row.innerHTML = `
        <div class="progress-row-label"><span>${group.label}</span><span>${group.masteredCount}/${group.total}</span></div>
        <div class="progress-row-bar"><div class="progress-row-fill${group.percent >= 100 ? ' mastered' : ''}" style="width:${group.percent}%"></div></div>
      `;
      list.appendChild(row);
    }
  }

  block.appendChild(heading);
  block.appendChild(percentLine);
  block.appendChild(list);
  blocksEl.appendChild(block);
}
</script>
</body>
</html>
