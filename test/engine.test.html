<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Tests — moteur de mémorisation</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #111; color: #eee; padding: 2rem; }
  .pass { color: #4caf50; }
  .fail { color: #ff5252; font-weight: bold; }
  #summary { font-size: 1.2rem; margin-top: 1rem; }
  li { margin: 0.2rem 0; }
</style>
</head>
<body>
<h1>Tests — moteur Leitner / faits (4 sections indépendantes)</h1>
<ul id="results"></ul>
<div id="summary"></div>

<script type="module">
import { buildOperationFamilies, introGroupOrderFor, viewsForFamily } from '../src/engine/facts.js';
import { createCard, recordAnswer, isDue, selectDailyFacts } from '../src/engine/leitner.js';

const results = document.getElementById('results');
let pass = 0, fail = 0;

function assert(condition, message) {
  const li = document.createElement('li');
  if (condition) {
    pass++;
    li.className = 'pass';
    li.textContent = `✓ ${message}`;
  } else {
    fail++;
    li.className = 'fail';
    li.textContent = `✗ ${message}`;
  }
  results.appendChild(li);
}

function assertEqual(actual, expected, message) {
  assert(actual === expected, `${message} (attendu: ${expected}, obtenu: ${actual})`);
}

// --- facts.js : chaque opération est indépendante ---

const multFamilies = buildOperationFamilies('multiplication');
const divFamilies = buildOperationFamilies('division');
const addFamilies = buildOperationFamilies('addition');
const subFamilies = buildOperationFamilies('subtraction');

assertEqual(multFamilies.length, 91, 'multiplication : 91 familles (0..12, 13*14/2)');
assertEqual(divFamilies.length, 78, 'division : 78 familles (0..12 sans diviser par 0)');
assertEqual(addFamilies.length, 78, 'addition : 78 familles (1..12, 12*13/2)');
assertEqual(subFamilies.length, 78, 'soustraction : 78 familles (1..12)');

assert(divFamilies.every((f) => f.a >= 1), 'aucune famille de division ne divise par 0');

const allIds = [...multFamilies, ...divFamilies, ...addFamilies, ...subFamilies].map((f) => f.id);
assertEqual(new Set(allIds).size, allIds.length, 'aucun identifiant en double entre les 4 sections');

const mult6x7 = multFamilies.find((f) => (f.a === 6 && f.b === 7) || (f.a === 7 && f.b === 6));
assertEqual(mult6x7.introGroup, 'trois-six', '6×7 est couvert par la table du 6 (groupe "trois-six")');

const div6x7 = divFamilies.find((f) => (f.a === 6 && f.b === 7) || (f.a === 7 && f.b === 6));
assertEqual(div6x7.introGroup, mult6x7.introGroup, 'la division hérite du même regroupement pédagogique que la multiplication');

const add7and8 = addFamilies.find((f) => f.a === 7 && f.b === 8);
assertEqual(add7and8.introGroup, 'passage-dizaine', '7+8 est priorisé (passe la dizaine)');

// --- facts.js : vues (chaque famille n'appartient qu'à SA propre opération) ---

const multViews = viewsForFamily(mult6x7);
assert(multViews.every((v) => v.kind === 'mult'), 'une famille de multiplication n\'expose que des vues ×');
assertEqual(multViews.length, 2, '6×7 a 2 vues (6×7 et 7×6)');

const divViews = viewsForFamily(div6x7);
assert(divViews.every((v) => v.kind === 'div'), 'une famille de division n\'expose que des vues ÷');
const divAnswers = divViews.map((v) => v.answer).sort();
assertEqual(JSON.stringify(divAnswers), JSON.stringify([6, 7]), '42÷6=7 et 42÷7=6 sont les deux vues de division');

const subViews = viewsForFamily(subFamilies.find((f) => f.a === 7 && f.b === 8));
assert(subViews.every((v) => v.kind === 'sub'), 'une famille de soustraction n\'expose que des vues −');

// --- leitner.js : progression des paliers (inchangé, indépendant de l'opération) ---

let card = createCard('mult-6x7', '2026-01-01');
assertEqual(card.box, 0, 'nouvelle carte commence au palier 0');

card = recordAnswer(card, true, '2026-01-01');
assertEqual(card.dueDate, '2026-01-02', 'palier 0 : due le lendemain après un bon rappel');

card = recordAnswer(card, true, '2026-01-01'); // même jour : ne doit pas compter deux fois
assertEqual(card.spacedCorrectStreak, 1, 'deux bonnes réponses le même jour ne comptent qu une fois pour la promotion');

card = recordAnswer(card, true, '2026-01-02');
card = recordAnswer(card, true, '2026-01-06');
assertEqual(card.box, 1, 'après 3 bons rappels à des jours différents, la carte monte au palier 1');

card = recordAnswer(card, false, '2026-01-09');
assertEqual(card.box, 0, 'une erreur fait redescendre immédiatement au palier 0');
assertEqual(card.dueDate, '2026-01-09', 'après une erreur, due le jour même (même session)');

// --- leitner.js : sélection quotidienne, une section à la fois ---

const cardsById = new Map();
const introGroupOrder = introGroupOrderFor('multiplication');
const { reviewFamilies: r0, newFamilies: n0 } = selectDailyFacts(multFamilies, cardsById, '2026-01-01', {
  maxNewFacts: 4,
  introGroupOrder,
});
assertEqual(r0.length, 0, 'jour 1 : aucune révision (aucune carte encore créée)');
assertEqual(n0.length, 4, 'jour 1 : au plus 4 nouveaux faits (plafond de session)');
assert(n0.every((f) => f.introGroup === 'zeros-uns'), 'jour 1 : les nouveaux faits viennent du tout premier groupe (×0/×1)');

const zerosUnsFamilies = multFamilies.filter((f) => f.introGroup === 'zeros-uns');
for (const f of zerosUnsFamilies) cardsById.set(f.id, createCard(f.id, '2026-01-01'));

const { newFamilies: n1 } = selectDailyFacts(multFamilies, cardsById, '2026-01-01', {
  maxNewFacts: 4,
  introGroupOrder,
});
assert(
  n1.some((f) => f.introGroup === 'deux-cinq-dix'),
  'une fois "zeros-uns" entièrement introduit, le groupe ×2,×5,×10 s ouvre'
);

// Une carte due pour révision, dans une section séparée (addition) — vérifie
// que les sections ne se mélangent pas.
const addCardsById = new Map();
const addFirst = addFamilies[0];
addCardsById.set(addFirst.id, { ...createCard(addFirst.id, '2026-01-01'), dueDate: '2026-01-01' });
const { reviewFamilies: rAdd } = selectDailyFacts(addFamilies, addCardsById, '2026-01-01', {
  maxNewFacts: 4,
  introGroupOrder: introGroupOrderFor('addition'),
});
assert(rAdd.some((f) => f.id === addFirst.id), 'une carte due en addition apparaît en révision, indépendamment de la multiplication');
assertEqual(cardsById.has(addFirst.id), false, 'les cartes de multiplication et d addition ne se mélangent pas');

// --- résumé ---
document.getElementById('summary').innerHTML =
  `<strong>${pass} réussis, ${fail} échoués</strong>` + (fail === 0 ? ' — tout est vert ✅' : ' — à corriger ❌');
document.title = fail === 0 ? `✅ ${pass} tests OK` : `❌ ${fail} tests en échec`;
</script>
</body>
</html>
